name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build APK (preview profile)
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive

      - name: Wait for EAS build
        working-directory: mobile
        run: |
          BUILD_ID=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"
          
          # Poll for build completion
          for i in $(seq 1 60); do
            STATUS=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].status')
            echo "Attempt $i: Status = $STATUS"
            if [ "$STATUS" = "finished" ]; then
              echo "Build completed!"
              break
            elif [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 60
          done

      - name: Download APK artifact
        working-directory: mobile
        run: |
          BUILD_ID=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].id')
          APK_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          echo "Downloading APK from: $APK_URL"
          curl -L -o ../website/downloads/cravyapp.apk "$APK_URL"
          echo "APK downloaded successfully"
          ls -la ../website/downloads/

      - name: Commit APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/downloads/cravyapp.apk
          git diff --staged --quiet || git commit -m "chore: update APK build [skip ci]"
          git push
