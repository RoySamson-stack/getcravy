<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cravyapp Admin - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css?v=7">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="eyebrow">Admin Portal</div>
                <h1>cravyapp</h1>
                <p>Operations portal for restaurants, menu performance, reservations, events, and revenue reporting.</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@cravyapp.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div id="loginError" class="error-message"></div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim() || 'admin@example.com';

            localStorage.removeItem('adminPreviewMode');
            localStorage.setItem('adminToken', 'dev-admin-token');
            localStorage.setItem('adminUser', JSON.stringify({
                id: 'dev-admin',
                name: 'Admin User',
                email,
                role: 'admin'
            }));

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
